# Paste this into Streamlit Cloud > your app > Settings > Secrets.
# Do NOT commit real keys to GitHub.

GROQ_API_KEY = "gsk_paste_your_groq_key_here"
# GROQ_MODEL = "llama-3.3-70b-versatile"   # optional

# --- Google sign-in (see README step 3) ---
[auth]
redirect_uri = "https://YOUR-APP-NAME.streamlit.app/oauth2callback"
cookie_secret = "any-long-random-string-at-least-32-characters"
client_id = "xxxxxxxx.apps.googleusercontent.com"
client_secret = "GOCSPX-xxxxxxxx"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

# --- OR, for a quick demo without Google sign-in, delete the [auth] block
# --- and add this line ABOVE it instead (top of the file):
# ALLOW_GUEST = "true"
